services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdfchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-pdf_chat_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:-changeme}']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-changeme}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      CONTAINER: '1'
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-pdfchat}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-pdf_chat_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      LOCAL_STORAGE_PATH: /app/storage
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      INSFORGE_URL: ${VITE_INSFORGE_URL:-}
      TRUST_PROXY: '1'
      RATE_LIMIT_ENABLED: 'true'
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-524288000}
      UPLOAD_CHUNK_SIZE: ${UPLOAD_CHUNK_SIZE:-10485760}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    volumes:
      - pdf-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:5000:5000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5000/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_INSFORGE_URL: ${VITE_INSFORGE_URL:-}
        VITE_INSFORGE_ANON_KEY: ${VITE_INSFORGE_ANON_KEY:-}
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  pdf-storage:
